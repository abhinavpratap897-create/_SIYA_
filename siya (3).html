</style></head><body>
<header><div class="logo row" style="flex-wrap:nowrap;gap:10px"><span class="ibox" style="width:36px;height:36px;background:var(--g);color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span><span>SIYA<small>CLINICAL INTELLIGENCE</small></span></div><nav id="nav"></nav><span class="hsp"></span><button class="btn d sm hb" onclick="sos()" aria-label="Emergency card" style="font-weight:700">SOS</button><button class="btn s sm hb" onclick="profileForm()">Profile &amp; data</button></header>
<main id="main"></main><div id="modal"></div><button class="fab" id="fab" onclick="toggleBot()" aria-label="Open SIYA nurse chatbot" title="Chat with SIYA nurse"></button><div class="bw" id="bw" hidden role="dialog" aria-label="SIYA chatbot"></div>
<script>
const $=s=>document.querySelector(s),K='siya_v1',uid=()=>Math.random().toString(36).slice(2,9),td=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const seed=()=>({profile:{name:'',age:'',allergies:'',deductible:0,contact:'',blood:''},tab:'guide',records:[],exp:[],meds:[],appts:[],vitals:[],chat:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))||seed()}catch(e){S=seed()}
S=Object.assign(seed(),S);S.chat=(S.chat||[]).filter(c=>c.a);{const cl=a=>(a||[]).filter(x=>!/\(sample\)/.test(x.title||x.provider||x.name||''));S.records=cl(S.records);S.exp=cl(S.exp);S.meds=cl(S.meds);if(S.profile.deductible==1750)S.profile.deductible=0;if(S.profile.name=='Friend')S.profile.name=''}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full. Export a backup and remove large files.')}}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),5000)}
const TABS=[['guide','Product Guide & Onboarding','Guide'],['dash','Health Dashboard','Dashboard'],['rec','Lifetime Medical Records','Records'],['cost','Cost & Expenses','Costs'],['rem','Reminders & Schedule','Reminders']];
function go(t){if(t=='ai'){openBot();return}if(innerWidth<=560)closeBot();S.tab=t;save();render();fx();scrollTo({top:0})}
function fx(){const m=$('#main');m.classList.remove('fx');void m.offsetWidth;m.classList.add('fx')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,.num,.big112');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.2,x=document.createElement('span');x.className='rip';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),600)});
function render(){if(!V[S.tab])S.tab='guide';$('#nav').innerHTML=TABS.map(([k,l,sh])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')"><span class="nlg">${l}</span><span class="nsh">${sh}</span></button>`).join('');try{const o=$('#nav .on');o&&o.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}$('#main').innerHTML=V[S.tab]();}
/* modal form helper */
let FH;function form(title,fields,cb,del){FH=cb;$('#modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="card" role="dialog" aria-label="${title}"><h2>${title}</h2><form onsubmit="event.preventDefault();submitForm(this)">${fields.map(f=>`<label>${f.l}</label>`+(f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${o}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea name="${f.k}" rows="3">${esc(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.r?'required':''} ${f.t=='number'?'step="any"':''}>`)).join('')}<div class="row" style="margin-top:16px"><button class="btn">Save</button><button type="button" class="btn s" onclick="closeM()">Cancel</button></div></form></div></div>`;const f1=$('#modal input:not([type=file])');f1&&f1.focus()}
function closeM(){$('#modal').innerHTML=''}
addEventListener('keydown',e=>{if(e.key=='Escape'){if($('#modal').innerHTML)closeM();else closeBot()}});
async function submitForm(f){const d={};for(const e of f.elements){if(!e.name)continue;if(e.type=='file'){const fl=e.files[0];if(fl){if(fl.size>1.2e6){toast('File over 1.2 MB: saved without attachment.')}else d[e.name]=await new Promise(r=>{const x=new FileReader;x.onload=()=>r({n:fl.name,u:x.result});x.readAsDataURL(fl)})}}else d[e.name]=e.value}FH(d);save();closeM();render()}
const del=(k,id)=>{if(confirm('Delete this item?')){S[k]=S[k].filter(x=>x.id!=id);save();render()}};
/* ---------- views ---------- */
const V={};

if(/\bmy (medicines?|medications?|meds|tablets|pills)\b|next dose|what (medicines?|medication)s? (do i|am i)/.test(t)){if(!S.meds.length)return'You have no medicines saved yet. '+CH('rem','Add a reminder');const nd=nextDose();return'<b>Your medicines</b>'+LI([...S.meds].sort((a,b)=>a.time.localeCompare(b.time)).map(m=>`${m.time} · ${esc(m.name)} ${esc(m.dose)}${m.taken[td()]?' (taken today)':''}`))+(nd?`<p>Next dose: <b>${esc(nd.name)} at ${nd.time}</b>.</p>`:'<p>All doses are taken for today.</p>')+CH('rem','Open Reminders')}
if(/appointment|doctor visit|next visit/.test(t)&&/\b(my|next|upcoming|when)\b/.test(t)){const a=S.appts.filter(x=>x.date>=td()).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time))[0];return a?`Your next appointment is <b>${esc(a.title)}</b> on <b>${a.date} at ${a.time}</b>${a.place?' ('+esc(a.place)+')':''}.`:'You have no upcoming appointments. '+CH('rem','Add one')}
if(/(how much|what).*(spen[dt]|paid|expens|cost)|my (spending|expenses|bills|costs)|out.of.pocket/.test(t)){const b=S.exp.reduce((s,e)=>s+(+e.billed||0),0);return S.exp.length?`This year you paid <b>${money(oop())}</b> out of pocket. Your total billed amount on record is <b>${money(b)}</b> across ${S.exp.length} bills. `+CH('cost','Open Costs'):'No expenses recorded yet. '+CH('cost','Add an expense')}
if(/my (blood pressure|bp|heart rate|pulse|glucose|sugar|vitals)|latest vitals/.test(t)){const v=S.vitals.slice(-1)[0];return v?`Your latest log (${v.date}): blood pressure <b>${esc(v.bp||'–')}</b>, glucose <b>${esc(v.glu||'–')}</b> mg/dL, heart rate <b>${esc(v.hr||'–')}</b> bpm.`:'You have not logged vitals yet. '+CH('dash','Log vitals')}
if(/my (allergies|allergy)|am i allergic|what am i allergic/.test(t))return P.allergies?`Your profile lists these allergies: <b>${esc(P.allergies)}</b>.`:'No allergies are saved. Add them in <b>Profile &amp; data</b> so I can check medicine advice against them.';
if(/my blood (group|type)|emergency contact/.test(t))return`Blood group: <b>${esc(P.blood)||'not set'}</b>. Emergency contact: <b>${esc(P.contact)||'not set'}</b>. Update them in Profile &amp; data.`;
if(/(how many|latest|last|recent).*(reports?|records?)|my (reports|records)/.test(t)){const r=[...S.records].sort((a,b)=>b.date.localeCompare(a.date));return r.length?`You have <b>${r.length}</b> records. The latest is <b>${esc(r[0].title)}</b> (${r[0].date}). `+CH('rec','Open Records'):'No records yet. '+CH('rec','Add your first record')}
if(/\bbmi\b|body mass/.test(t)){const w=t.match(/(\d{2,3}(?:\.\d+)?)\s*(?:kg|kgs|kilo)/),c=t.match(/(\d{2,3}(?:\.\d+)?)\s*cm/),f=t.match(/(\d)\s*(?:ft|feet|')\s*(\d{1,2})?/);let h=c?+c[1]/100:f?(+f[1]*12+(+f[2]||0))*.0254:0;if(w&&h){const k=+w[1],b=k/(h*h),cat=b<18.5?'underweight':b<23?'in the healthy range':b<25?'overweight':'in the obese range';return`Your BMI is <b>${b.toFixed(1)}</b>, which is <b>${cat}</b> by Indian and Asian cut-offs.<p>A healthy weight for your height is about ${(18.5*h*h).toFixed(0)}–${(22.9*h*h).toFixed(0)} kg.</p>${NOTE}`}}
for(const[k,ti,h]of FQ)if(k.test(t))return`<b>${ti}</b>${h}${NOTE}`;
const a=advise(q);if(a)return a;
return`I’m not sure about that one. I only answer health questions. Try a symptom (“fever and body ache”), a basic (“normal blood pressure?”), your records (“what medicines do I take?”) or the app (“how do I use this app?”). ${CH('guide','See what I can do')}`}

let BUSY=false;
function ask(q){q=(q||'').trim();if(!q||BUSY)return;const e={u:q,a:null,t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};S.chat.push(e);BUSY=true;openBot();setTimeout(()=>{try{e.a=bot(q)}catch(x){e.a='Sorry, something went wrong. Please try again.'}BUSY=false;save();botRender();if($('#bw').hidden)toast('SIYA replied in the chatbot.')},700)}
function logSym(n){S.records.push({id:uid(),title:'Symptom check: '+n,type:'Doctor Note',date:td(),provider:'SIYA self-check',notes:(S.chat.slice(-1)[0]?.u)||''});save();toast('Saved to Records.')}

const BQ=['How do I use this app?','About this app','Runny nose and sore throat','Normal blood pressure?','What medicines do I take?','Emergency numbers'];
function botRender(){const w=$('#bw'),old=w.querySelector('input[name=q]'),keep=old?old.value:'';
w.innerHTML=`<div class="bh"><span class="bav">${NURSE('nh')}</span><div style="flex:1;min-width:0"><b>SIYA Chatbot</b><div class="sm" style="opacity:.9">Health help, your records and app guide</div></div><button class="btn sm" onclick="if(confirm('Clear this chat?')){S.chat=[];save();botRender()}">New chat</button><button class="btn sm" aria-label="Close chat" onclick="closeBot()">✕</button></div>
<div class="bb" id="bb"><div class="a"><span class="sm g"><b>SIYA</b></span><p style="margin:2px 0 0">Hi${first()}! I’m your health chatbot. Describe how you feel, ask a health question, ask about your medicines, spending and appointments, or ask how to use this app.</p></div>${S.chat.map(c=>`<div class="u">${esc(c.u)}<div class="sm p">${c.t}</div></div>`+(c.a?`<div class="a"><span class="sm g"><b>SIYA</b></span><div>${c.a}</div></div>`:BUSY?'<div class="a typing"><i></i><i></i><i></i></div>':'')).join('')}</div>
<div class="bq">${BQ.map(q=>`<button class="chip" onclick="ask(this.textContent)">${q}</button>`).join('')}</div>
<form class="bf" onsubmit="event.preventDefault();const i=this.q,v=i.value;i.value='';ask(v)"><input name="q" style="flex:1" placeholder="Type a symptom or question…" autocomplete="off" aria-label="Message SIYA"><button class="btn">Send</button></form>
<div class="bn">General information, not a diagnosis. In an emergency call 112.</div>`;
const b=$('#bb');b.scrollTop=b.scrollHeight;const i=w.querySelector('input[name=q]');if(i){i.value=keep;if(!w.hidden)i.focus()}}
function openBot(){$('#bw').hidden=false;botRender()}
function closeBot(){$('#bw').hidden=true}
function toggleBot(){$('#bw').hidden?openBot():closeBot()}
/* reminders */
const MF=()=>[{k:'name',l:'Medicine name',r:1},{k:'dose',l:'Dose (e.g. 500 mg, 1 tablet)'},{k:'time',l:'Time every day',t:'time',v:'08:00',r:1},{k:'notes',l:'Instructions (e.g. after meals)'}];
function medForm(){form('New medication reminder',MF(),d=>{S.meds.push({id:uid(),...d,taken:{}});askNotif()})}
function apptForm(){form('Add doctor appointment',[{k:'title',l:'Doctor / purpose',r:1},{k:'date',l:'Date',t:'date',r:1},{k:'time',l:'Time',t:'time',v:'10:00',r:1},{k:'place',l:'Place'}],d=>{S.appts.push({id:uid(),...d});askNotif()})}
function vitForm(){form('Log vitals',[{k:'bp',l:'Blood pressure (e.g. 118/76)'},{k:'glu',l:'Fasting glucose (mg/dL)',t:'number'},{k:'hr',l:'Resting heart rate (bpm)',t:'number'}],d=>S.vitals.push({date:td(),...d}))}
const take=id=>{const m=S.meds.find(x=>x.id==id);m.taken[td()]=true;save();render()};
function askNotif(){if('Notification'in window&&Notification.permission=='default')Notification.requestPermission()}
V.rem=()=>{const t=td(),n=S.meds.length,done=S.meds.filter(m=>m.taken[t]).length,ap=[...S.appts].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),perm='Notification'in window?Notification.permission:'unsupported';
return`<div class="row sp"><div><h1>Medical Reminders &amp; Schedule</h1><p class="p">Daily doses and appointments with notifications while this page is open.</p></div><div class="row"><button class="btn s" onclick="apptForm()">+ Add doctor appointment</button><button class="btn" onclick="medForm()">+ New medication reminder</button></div></div>
${perm!='granted'?`<div class="dose row sp"><span>Notifications are ${perm=='denied'?'blocked in your browser settings':'off'}. Turn them on to get alerts.</span>${perm=='default'?'<button class="btn sm" onclick="Notification.requestPermission().then(render)">Enable notifications</button>':''}</div>`:''}
<div class="grid g4" style="margin:14px 0"><div class="card"><span class="p sm">Today's doses taken</span><div class="big">${done} / ${n}</div><div class="bar"><i style="width:${n?done/n*100:0}%"></i></div></div><div class="card"><span class="p sm">Upcoming appointments</span><div class="big">${ap.filter(a=>a.date>=t).length}</div></div></div>
<div class="grid g2"><div class="card"><h2>Today's medication protocol</h2>${[...S.meds].sort((a,b)=>a.time.localeCompare(b.time)).map(m=>`<div class="item row sp"><div><b>${m.time}</b> · ${esc(m.name)} ${esc(m.dose)}<div class="sm p">${esc(m.notes)}</div></div><div class="row">${m.taken[t]?'<span class="tag">Taken</span>':`<button class="btn sm" onclick="take('${m.id}')">Mark as taken</button>`}<button class="btn s sm" onclick="medEdit('${m.id}')">Edit</button><button class="btn d sm" onclick="del('meds','${m.id}')">Delete</button></div></div>`).join('')||'<p class="p">No reminders yet. Add a medication to start.</p>'}</div>
<div class="card"><h2>Clinical visits &amp; labs</h2>${ap.map(a=>`<div class="item"><b>${esc(a.title)}</b><div class="sm p">${a.date} at ${a.time} ${esc(a.place||'')}</div><div class="sm g">Reminder 1 hour before</div><button class="btn d sm" onclick="del('appts','${a.id}')">Delete</button></div>`).join('')||'<p class="p">No appointments yet.</p>'}</div></div>`};
function medEdit(id){const m=S.meds.find(x=>x.id==id);form('Edit reminder',MF().map(f=>({...f,v:m[f.k]})),d=>Object.assign(m,d))}
/* profile & backup */
function profileForm(){const P=S.profile;form('Profile & data',[{k:'name',l:'Your name',v:P.name},{k:'age',l:'Age',v:P.age},{k:'blood',l:'Blood group',v:P.blood},{k:'allergies',l:'Known allergies (comma separated)',v:P.allergies},{k:'deductible',l:'Annual insurance deductible (₹, optional)',t:'number',v:P.deductible},{k:'contact',l:'Emergency contact',v:P.contact}],d=>Object.assign(S.profile,d,{deductible:+d.deductible||0}));
$('#modal').querySelector('form').insertAdjacentHTML('afterend','<hr><div class="row"><button class="btn s sm" onclick="dl(\'siya-backup.json\',\'application/json\',JSON.stringify(S))">Export backup</button><button class="btn s sm" onclick="$(\'#imp\').click()">Import backup</button><button class="btn d sm" onclick="if(confirm(\'Erase ALL data?\')){localStorage.removeItem(K);location.reload()}">Erase all data</button><input type="file" id="imp" accept=".json" hidden onchange="imp(this.files[0])"></div>')}
function imp(f){if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);save();closeM();render()}catch(e){toast('Invalid backup file.')}})}
/* reminder engine */
const fired=new Set();function note(t,b){toast(t+': '+b);try{if(Notification.permission=='granted'){const o={body:b,icon:'icon.svg'};navigator.serviceWorker&&navigator.serviceWorker.ready?navigator.serviceWorker.ready.then(r=>r.showNotification(t,o)).catch(()=>new Notification(t,o)):new Notification(t,o)}}catch(e){}}
setInterval(()=>{const n=new Date(),hm=n.toTimeString().slice(0,5),d=td();S.meds.forEach(m=>{const k=m.id+d+m.time;if(m.time==hm&&!m.taken[d]&&!fired.has(k)){fired.add(k);note('Time for '+m.name,(m.dose||'')+' '+(m.notes||''))}});
S.appts.forEach(a=>{const at=new Date(a.date+'T'+a.time),df=(at-n)/6e4,k='a'+a.id;if(df<=60&&df>0&&!fired.has(k)){fired.add(k);note('Appointment in '+Math.round(df)+' min',a.title)}});const a=document.activeElement;if((S.tab=='dash'||S.tab=='rem')&&!$('#modal').innerHTML&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},20000);
$('#fab').innerHTML=NURSE('nf');render();fx();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
